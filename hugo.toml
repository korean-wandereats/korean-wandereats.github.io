baseURL = "https://korean-wandereats.github.io"
title = "Korean Wandereats - Global Restaurant Reviews"
theme = "PaperMod"
defaultContentLanguage = "en"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 12

[languages]
  [languages.en]
    label = "English"
    weight = 1
    title = "Korean Wandereats - Global Restaurant Reviews"
    [languages.en.params]
      description = "Honest global restaurant reviews from a Korean traveler's perspective"
  [languages.es]
    label = "Español"
    weight = 2
    title = "Korean Palate - Reseñas de Restaurantes"
    [languages.es.params]
      description = "Reseñas honestas de restaurantes globales desde la perspectiva de un viajero coreano"
  [languages.pt]
    label = "Português"
    weight = 3
    title = "Korean Palate - Avaliações de Restaurantes"
    [languages.pt.params]
      description = "Avaliações honestas de restaurantes globais na perspectiva de um viajante coreano"

[params]
  env = "production"
  author = "Korean Wandereats"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ["/images/og-image.jpg"]

[params.homeInfoParams]
  Title = "Korean Wandereats 🍜"
  Content = "Honest global restaurant reviews from a Korean food lover. Rated by taste, texture, umami, and value."

[[params.socialIcons]]
  name = "instagram"
  url = "https://instagram.com/yourhandle"

[taxonomies]
  category = "categories"
  tag = "tags"
  country = "countries"
  city = "cities"

[outputs]
  home = ["HTML", "RSS", "JSON"]
